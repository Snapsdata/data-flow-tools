<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAPS · Reporte Semanal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; background: #f0f0f0; color: #111; min-height: 100vh; }
.shell { max-width: 860px; margin: 0 auto; padding: 32px 20px 120px; }

/* ── HEADER ── */
.header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid #ddd; margin-bottom: 24px; }
.logo { display: flex; flex-direction: column; gap: 2px; }
.logo img { height: 24px; width: auto; }
.logo-fallback { font-size: 20px; font-weight: 800; letter-spacing: 4px; color: #111; text-transform: uppercase; line-height: 1; }
.header-right { display: flex; align-items: center; gap: 10px; }
.header-sub { font-size: 9px; color: #bbb; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px; }
.period-tag { font-size: 11px; color: #888; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 4px 10px; }
.btn-cfg { font-family: inherit; font-size: 10px; font-weight: 600; color: #999; background: transparent; border: 1px solid #e0e0e0; border-radius: 4px; padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all .12s; white-space: nowrap; letter-spacing: 0.3px; }
.btn-cfg:hover { border-color: #aaa; color: #444; background: #fafafa; }
.btn-cfg.active { background: #434343; color: #fff; border-color: #434343; }

/* ── ZONA CARGA ── */
.upload-zone { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.upload-tabs { display: flex; border-bottom: 1px solid #e8e8e8; }
.utab { flex: 1; padding: 11px 16px; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #bbb; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .12s; background: #fafafa; }
.utab.active { color: #111; border-bottom-color: #111; background: #fff; }
.utab-body { display: none; padding: 18px 20px; }
.utab-body.active { display: block; }

.drop { border: 2px dashed #ddd; border-radius: 8px; padding: 36px 20px; text-align: center; cursor: pointer; transition: all 0.15s; background: #fafafa; position: relative; }
.drop:hover, .drop.over { border-color: #434343; background: #f5f5f5; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-icon { font-size: 28px; margin-bottom: 8px; }
.drop h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #111; }
.drop p  { font-size: 11px; color: #aaa; }

.drive-row { display: flex; gap: 8px; align-items: center; }
.drive-input { flex: 1; font-family: inherit; font-size: 13px; background: #fafafa; border: 1px solid #ddd; border-radius: 6px; color: #111; padding: 10px 14px; outline: none; transition: border-color .12s; }
.drive-input:focus { border-color: #434343; background: #fff; }
.drive-input::placeholder { color: #bbb; }
.drive-status { font-size: 11px; color: #aaa; font-style: italic; margin-top: 8px; min-height: 16px; }
.drive-status.ok  { color: #2a7a4a; font-style: normal; font-weight: 600; }
.drive-status.err { color: #FF453A; font-style: normal; }

/* ── CHIPS ── */
.file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 5px; margin-top: 12px; }
.chip { display: flex; align-items: center; gap: 7px; padding: 5px 9px; background: #fafafa; border: 1px solid #e8e8e8; border-radius: 5px; font-size: 11px; color: #555; }
.chip.ok   { border-color: #434343; background: #f5f5f5; }
.chip.err  { border-color: #FF453A; background: #fff5f5; color: #FF453A; }
.chip.proc { color: #aaa; }
.chip-dot  { width: 5px; height: 5px; border-radius: 50%; background: #ddd; flex-shrink: 0; }
.chip.ok   .chip-dot { background: #434343; }
.chip.err  .chip-dot { background: #FF453A; }
.chip.proc .chip-dot { animation: blink .7s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.chip-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-rm { background: none; border: none; color: #ccc; cursor: pointer; font-size: 13px; padding: 0; flex-shrink: 0; }
.chip-rm:hover { color: #FF453A; }

/* ── PROGRESS ── */
.prog-wrap { display: none; margin-top: 12px; }
.prog-wrap.on { display: block; }
.prog-labels { display: flex; justify-content: space-between; font-size: 10px; color: #aaa; margin-bottom: 4px; }
.prog-bg { height: 3px; background: #e8e8e8; border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; background: #434343; border-radius: 99px; width: 0%; transition: width 0.2s; }

/* ── ACTIONS BAR ── */
.actions { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
.btn { font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; padding: 10px 22px; border-radius: 6px; cursor: pointer; border: none; transition: all 0.12s; }
.btn-primary { background: #434343; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #262626; }
.btn-ghost  { background: #fff; color: #666; border: 1px solid #ddd; }
.btn-ghost:hover:not(:disabled) { border-color: #999; color: #111; }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.count-tag { margin-left: auto; font-size: 11px; color: #aaa; }

/* ── BANNERS ── */
.banner { border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; font-size: 12px; display: none; }
.banner.on { display: block; }
.banner strong { font-weight: 700; display: block; margin-bottom: 3px; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; }
.banner-warn { background: #fffbe6; border: 1px solid #e0cc66; color: #6b5a00; }
.banner-dup  { background: #fff0f0; border: 1px solid #e0aaaa; color: #7a0000; }
.banner-date { background: #fff8f0; border: 1px solid #e0c488; color: #6b3a00; }
.banner ul { list-style: none; }
.banner ul li { padding: 2px 0; border-bottom: 1px solid rgba(0,0,0,.05); font-size: 11px; }
.banner ul li:last-child { border: none; }

/* ── RESUMEN PERIODO ── */
.periodo-card { background: #434343; border-radius: 10px; margin-bottom: 14px; padding: 22px 28px; display: flex; align-items: stretch; flex-wrap: wrap; gap: 0; }
.periodo-pill { display: flex; flex-direction: column; justify-content: center; padding: 4px 28px 4px 0; }
.periodo-pill:first-child { padding-left: 0; }
.periodo-label { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.35); margin-bottom: 6px; }
.periodo-value { font-size: 20px; font-weight: 800; color: #fff; line-height: 1; }
.periodo-divider { width: 1px; background: rgba(255,255,255,.1); margin: 0 28px 0 0; align-self: stretch; min-height: 44px; }
.periodo-best .periodo-value { color: #30D158; }

/* ── STATS ── */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 14px 16px; }
.stat-label { font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
